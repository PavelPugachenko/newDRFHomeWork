services:
  db:
    image: postgres:13
    env_file:
      - ./.env.sample
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data/

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  web:
    build: .
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn homework.wsgi --bind 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    env_file:
      - ./.env.sample

  celery:
    build: .
    command: celery -A homework worker --loglevel=info
    env_file:
      - ./.env.sample
    depends_on:
      - redis
      - db

  celery-beat:
    build: .
    command: celery -A homework beat --loglevel=info
    env_file:
      - ./.env.sample
    depends_on:
      - redis
      - db

volumes:
  postgres_data: